name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The matrix installs the newest 0.3.x / 1.x TypeORM and pg 8.x, so a new upstream release can break us
  # without any push here. A weekly run (default branch only) makes that visible.
  schedule:
    - cron: '17 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    name: lint, typecheck, build, pack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Tarball contents
        run: npm pack --dry-run

  test:
    name: tests (typeorm ${{ matrix.typeorm }}, postgres ${{ matrix.postgres }}, node ${{ matrix.node }}, pg ${{ matrix.pg }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22]
        postgres: ['16', '18']
        typeorm: ['0.3.20', '0.3', '1']
        # '8' = newest 8.x. It is an axis (not only an include key) so that the pg 8.5.1 entry below
        # becomes its own job instead of being merged into an existing combination.
        pg: ['8']
        include:
          # Oldest supported pg driver, and the Node lines on either side of 22.
          - { node: 22, postgres: '16', typeorm: '0.3', pg: '8.5.1' }
          - { node: 20, postgres: '16', typeorm: '1', pg: '8' }
          - { node: 24, postgres: '16', typeorm: '1', pg: '8' }
          # The other PostgreSQL majors, with the newest TypeORM line.
          - { node: 22, postgres: '12', typeorm: '1', pg: '8' }
          - { node: 22, postgres: '13', typeorm: '1', pg: '8' }
          - { node: 22, postgres: '14', typeorm: '1', pg: '8' }
          - { node: 22, postgres: '15', typeorm: '1', pg: '8' }
          - { node: 22, postgres: '17', typeorm: '1', pg: '8' }
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TTM_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      TTM_REQUIRE_PGBOUNCER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install PgBouncer (its tests are skipped without it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pgbouncer
      - name: Select TypeORM / pg versions under test
        # One install for both: a second `npm install --no-save` re-resolves the tree and silently puts the
        # first package back to the lockfile version (every job here once ran TypeORM 0.3.31).
        run: |
          npm install --no-save --no-audit --no-fund "typeorm@${{ matrix.typeorm }}" "pg@${{ matrix.pg }}"
          node scripts/assert-versions.mjs typeorm "${{ matrix.typeorm }}" pg "${{ matrix.pg }}"
      - run: npm run typecheck
      - name: Tests
        if: ${{ !(matrix.typeorm == '1' && matrix.postgres == '18' && matrix.node == 22 && matrix.pg == '8') }}
        run: npm test
      - name: Tests with coverage gate
        if: ${{ matrix.typeorm == '1' && matrix.postgres == '18' && matrix.node == 22 && matrix.pg == '8' }}
        run: npm run coverage

  tarball:
    name: install from tarball and run the README flow
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        typeorm: ['0.3', '1']
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TTM_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: scripts/verify-tarball.sh "${{ matrix.typeorm }}"

  tls:
    name: TLS (PostgreSQL service with ssl = on)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TTM_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      TTM_REQUIRE_SSL: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Turn TLS on in the PostgreSQL service (self-signed certificate)
        run: |
          set -euo pipefail
          openssl req -new -x509 -days 2 -nodes -subj "/CN=localhost" -out server.crt -keyout server.key
          CID=$(docker ps --filter "ancestor=postgres:16" --format '{{.ID}}' | head -1)
          test -n "$CID"
          docker cp server.crt "$CID:/var/lib/postgresql/server.crt"
          docker cp server.key "$CID:/var/lib/postgresql/server.key"
          docker exec -u 0 "$CID" sh -c 'chown postgres:postgres /var/lib/postgresql/server.crt /var/lib/postgresql/server.key && chmod 600 /var/lib/postgresql/server.key'
          docker exec "$CID" psql -U postgres \
            -c "ALTER SYSTEM SET ssl = on" \
            -c "ALTER SYSTEM SET ssl_cert_file = '/var/lib/postgresql/server.crt'" \
            -c "ALTER SYSTEM SET ssl_key_file = '/var/lib/postgresql/server.key'" \
            -c "SELECT pg_reload_conf()"
          sleep 2
          test "$(PGPASSWORD=postgres psql -h localhost -U postgres -tAc 'SHOW ssl')" = "on"
      - name: TLS tests
        run: npx vitest run test/integration/ssl.test.ts

  os:
    name: ${{ matrix.os }} (native PostgreSQL ${{ matrix.pgmajor }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, pgmajor: '16', node: 22 }
          - { os: macos-latest, pgmajor: '18', node: 22 }
          - { os: windows-latest, pgmajor: '16', node: 22 }
          - { os: windows-latest, pgmajor: '18', node: 22 }
          # The Node lines on either side of 22, on the two other operating systems (Linux has them in the main matrix), with one PostgreSQL.
          - { os: macos-latest, pgmajor: '16', node: 20 }
          - { os: macos-latest, pgmajor: '16', node: 24 }
          - { os: windows-latest, pgmajor: '16', node: 20 }
          - { os: windows-latest, pgmajor: '16', node: 24 }
    env:
      TTM_TEST_PG_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TTM_REQUIRE_SSL: '1' # every row turns TLS on below, so the TLS tests cannot be skipped by accident
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: The Node major under test is the one the matrix asked for
        shell: bash
        run: |
          node --version
          test "$(node -p "process.versions.node.split('.')[0]")" = "${{ matrix.node }}"
      - name: Install and start PostgreSQL (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install postgresql@${{ matrix.pgmajor }}
          BIN="$(brew --prefix postgresql@${{ matrix.pgmajor }})/bin"
          echo "$BIN" >> "$GITHUB_PATH"
          brew services start postgresql@${{ matrix.pgmajor }}
          for i in $(seq 1 30); do "$BIN/pg_isready" -h 127.0.0.1 && break; sleep 2; done
          "$BIN/psql" -h 127.0.0.1 -d postgres -c "CREATE ROLE postgres SUPERUSER LOGIN PASSWORD 'postgres'"
          # Homebrew initializes with "trust": any password would be accepted, which defeats the tests that
          # prove a wrong password is rejected. Require passwords, then restart.
          DATA="$(brew --prefix)/var/postgresql@${{ matrix.pgmajor }}"
          sed -i '' -E 's/[[:space:]]trust$/ scram-sha-256/' "$DATA/pg_hba.conf"
          brew services restart postgresql@${{ matrix.pgmajor }}
          for i in $(seq 1 30); do "$BIN/pg_isready" -h 127.0.0.1 && break; sleep 2; done
          PGPASSWORD=postgres "$BIN/psql" -h 127.0.0.1 -U postgres -d postgres -tAc "select 'password auth ok'"
      - name: Turn TLS on (macOS, self-signed certificate)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(brew --prefix postgresql@${{ matrix.pgmajor }})/bin"
          DATA="$(brew --prefix)/var/postgresql@${{ matrix.pgmajor }}"
          openssl req -new -x509 -days 2 -nodes -subj "/CN=localhost" -out "$DATA/server.crt" -keyout "$DATA/server.key"
          chmod 600 "$DATA/server.key"
          echo "ssl = on" >> "$DATA/postgresql.conf"
          brew services restart postgresql@${{ matrix.pgmajor }}
          for i in $(seq 1 30); do "$BIN/pg_isready" -h 127.0.0.1 && break; sleep 2; done
          test "$(PGPASSWORD=postgres "$BIN/psql" -h 127.0.0.1 -U postgres -d postgres -tAc 'SHOW ssl')" = "on"
      - name: Install PgBouncer (macOS; its tests cannot be skipped silently)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          brew install pgbouncer
          PGB="$(brew --prefix pgbouncer)/bin/pgbouncer"
          "$PGB" --version
          echo "TTM_PGBOUNCER_BIN=$PGB" >> "$GITHUB_ENV"
          echo "TTM_REQUIRE_PGBOUNCER=1" >> "$GITHUB_ENV"
      - name: Install and start PostgreSQL (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # community.chocolatey.org answers 504 now and then; that is an outage of the package feed, not a test failure.
          $bin = "C:\Program Files\PostgreSQL\${{ matrix.pgmajor }}\bin"
          $installed = $false
          for ($attempt = 1; $attempt -le 3 -and -not $installed; $attempt++) {
            choco install postgresql${{ matrix.pgmajor }} --no-progress -y --params "/Password:postgres"
            if ($LASTEXITCODE -eq 0 -and (Test-Path "$bin\pg_isready.exe")) { $installed = $true }
            elseif ($attempt -lt 3) { Write-Host "choco install failed (attempt $attempt of 3), retrying in 30 s"; Start-Sleep -Seconds 30 }
          }
          if (-not $installed) { throw "PostgreSQL ${{ matrix.pgmajor }} could not be installed with Chocolatey after 3 attempts" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          for ($i = 0; $i -lt 30; $i++) { & "$bin\pg_isready.exe" -h 127.0.0.1; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 2 }
      - name: Turn TLS on (Windows, self-signed certificate)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "C:\Program Files\PostgreSQL\${{ matrix.pgmajor }}\bin"
          $data = "C:\Program Files\PostgreSQL\${{ matrix.pgmajor }}\data"
          & "C:\Program Files\Git\usr\bin\openssl.exe" req -new -x509 -days 2 -nodes -subj "/CN=localhost" -out "$data\server.crt" -keyout "$data\server.key"
          if ($LASTEXITCODE -ne 0) { throw "openssl could not create the certificate" }
          Add-Content -Path "$data\postgresql.conf" -Value "ssl = on"
          Restart-Service "postgresql-x64-${{ matrix.pgmajor }}"
          for ($i = 0; $i -lt 30; $i++) { & "$bin\pg_isready.exe" -h 127.0.0.1; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep -Seconds 2 }
          $env:PGPASSWORD = "postgres"
          $ssl = (& "$bin\psql.exe" -h 127.0.0.1 -U postgres -d postgres -tAc "SHOW ssl").Trim()
          if ($ssl -ne "on") { throw "SHOW ssl returned '$ssl', expected 'on'" }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  arm64:
    name: linux arm64 (postgres 16, node 22)
    runs-on: ubuntu-24.04-arm
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TTM_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
      TTM_REQUIRE_PGBOUNCER: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install PgBouncer (its tests are skipped without it)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq pgbouncer
      - run: npm run typecheck
      - run: npm test
